[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soundlabel"
version = "0.8.1"
description = "Open-source framework for running an AI music label: catalog, three-tier scoring stack, agent loop, ops sidecar, pluggable generation backends"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Yuchen Hu" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
zh = ["pypinyin"]
llm = ["anthropic>=0.60"]
rooms = ["livekit-api>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
soundlabel = "soundlabel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
