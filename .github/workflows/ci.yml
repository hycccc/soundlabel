name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # no apt: the manylinux soundfile wheel bundles libsndfile, and the
      # azure apt mirror has eaten whole jobs' timeout budgets before
      - run: pip install -e ".[dev]"
      - run: pytest -v
      - name: smoke-test the CLI demo
        run: |
          soundlabel -w /tmp/demo-label demo --tracks 2
          soundlabel -w /tmp/demo-label catalog
      - name: smoke-test the score command
        run: |
          f=$(find /tmp/demo-label/batches -name "*.wav" | head -1)
          soundlabel score "$f" --json | python -c "import json,sys; r=json.load(sys.stdin); assert r['gate'] and 'composite' in r"

  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: syntax-check every module
        run: for f in src/*.mjs; do node --check "$f"; done
      - name: boot smoke test (no API key — server must still come up)
        run: |
          PORT=19833 node src/server.mjs &
          curl -sf --retry 20 --retry-delay 1 --retry-connrefused http://localhost:19833/health
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: label↔ops wiring smoke (state.json → /label/review → soundlabel batches)
        working-directory: .
        # no apt here: the manylinux soundfile wheel bundles libsndfile, and
        # apt mirror flakiness once ate this job's whole timeout budget
        run: |
          pip install -e .
          soundlabel -w /tmp/wire demo --tracks 1
          test -f /tmp/wire/state.json
          SOUNDLABEL_WORKSPACE=/tmp/wire PORT=19834 node ops/src/server.mjs &
          curl -sf --retry 20 --retry-delay 1 --retry-connrefused http://localhost:19834/health | grep -F '/tmp/wire'
          curl -sf http://localhost:19834/label/state | grep -F '"batches"'
          bid=$(python -c "import json; print(json.load(open('/tmp/wire/state.json'))['batches'][0]['id'])")
          curl -sf -X POST http://localhost:19834/label/review \
            -H 'content-type: application/json' -d "{\"batchId\":\"$bid\"}" | grep -F '"headline"'
          soundlabel -w /tmp/wire batches | grep -F 'ops[heuristic]:'
